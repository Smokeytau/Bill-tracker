<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bill Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 text-gray-800 pb-12 font-sans">

  <div class="bg-indigo-600 text-white p-4 text-center shadow-md sticky top-0 z-10">
    <h1 class="text-xl font-bold">Weekly Bill Tracker</h1>
  </div>

  <div class="p-4 max-w-md mx-auto space-y-6">
    <!-- Add Bill Form -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
      <h2 class="text-lg font-semibold mb-3">Add New Bill</h2>
      <form id="add-bill-form" class="space-y-3">
        <div>
          <label class="block text-xs font-medium text-gray-500">Bill Name</label>
          <input type="text" id="title" required placeholder="e.g. Rent, Gym" class="w-full mt-1 p-2 border rounded-lg outline-none">
        </div>
        <div class="flex gap-2">
          <div class="w-1/2">
            <label class="block text-xs font-medium text-gray-500">Amount ($)</label>
            <input type="number" step="0.01" id="amount" required placeholder="0.00" class="w-full mt-1 p-2 border rounded-lg outline-none">
          </div>
          <div class="w-1/2">
            <label class="block text-xs font-medium text-gray-500">Due Date</label>
            <input type="date" id="due_date" required class="w-full mt-1 p-2 border rounded-lg outline-none">
          </div>
        </div>
        <div class="flex items-center space-x-2 pt-1">
          <input type="checkbox" id="is_recurring" class="w-4 h-4 accent-indigo-600 rounded">
          <label for="is_recurring" class="text-xs font-semibold text-gray-600">Repeat weekly when paid</label>
        </div>
        <button type="submit" class="w-full bg-indigo-600 text-white font-medium py-2 rounded-lg shadow">
          + Add Bill
        </button>
      </form>
    </div>

    <!-- Totals -->
    <div class="bg-indigo-50 p-4 rounded-xl flex justify-between items-center border border-indigo-100">
      <div>
        <span class="text-xs text-indigo-500 font-bold uppercase">Unpaid Balance</span>
        <div id="unpaid-total" class="text-2xl font-extrabold text-indigo-900">$0.00</div>
      </div>
      <div class="text-right">
        <span class="text-xs text-emerald-600 font-bold uppercase">Paid</span>
        <div id="paid-total" class="text-lg font-bold text-emerald-700">$0.00</div>
      </div>
    </div>

    <!-- Bill List -->
    <div>
      <h2 class="text-lg font-semibold mb-3">Your Bills</h2>
      <div id="bill-list" class="space-y-3">
        <p class="text-gray-400 text-center py-4">Loading...</p>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://ymmeaggrwmijscmcvrec.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_wHhwrP1cvzjdPtvYjs_NaA_9pbcnfSe";
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function fetchBills() {
      const { data: bills, error } = await supabaseClient
        .from('bills')
        .select('*')
        .order('due_date', { ascending: true });

      if (error) { console.error(error); return; }
      renderBills(bills);
    }

    function renderBills(bills) {
      const listEl = document.getElementById('bill-list');
      listEl.innerHTML = '';

      if (!bills || bills.length === 0) {
        listEl.innerHTML = '<p class="text-gray-400 text-center py-4">No bills found!</p>';
        document.getElementById('unpaid-total').innerText = '$0.00';
        document.getElementById('paid-total').innerText = '$0.00';
        return;
      }

      let unpaidSum = 0;
      let paidSum = 0;

      bills.forEach(bill => {
        if (bill.is_paid) paidSum += Number(bill.amount);
        else unpaidSum += Number(bill.amount);

        const card = document.createElement('div');
        card.className = `p-4 rounded-xl border flex items-center justify-between bg-white shadow-sm ${
          bill.is_paid ? 'border-gray-200 opacity-60' : 'border-indigo-100'
        }`;

        card.innerHTML = `
          <div class="flex items-center space-x-3">
            <input type="checkbox" ${bill.is_paid ? 'checked' : ''} 
              onchange="togglePaid(${bill.id}, ${bill.is_paid}, '${bill.title}', ${bill.amount}, '${bill.due_date}', ${bill.is_recurring})"
              class="w-5 h-5 accent-indigo-600 rounded">
            <div>
              <div class="font-semibold ${bill.is_paid ? 'line-through text-gray-500' : 'text-gray-800'}">
                ${bill.title}
                ${bill.is_recurring ? '<span class="text-[10px] bg-indigo-100 text-indigo-700 font-bold px-1.5 py-0.5 rounded ml-1">Weekly</span>' : ''}
              </div>
              <div class="text-xs text-gray-400">Due: ${bill.due_date}</div>
            </div>
          </div>
          <div class="flex items-center space-x-3">
            <span class="font-bold ${bill.is_paid ? 'text-gray-500' : 'text-indigo-600'}">
              $${Number(bill.amount).toFixed(2)}
            </span>
            <button onclick="deleteBill(${bill.id})" class="text-gray-300 hover:text-red-500 font-bold p-1">
              ✕
            </button>
          </div>
        `;
        listEl.appendChild(card);
      });

      document.getElementById('unpaid-total').innerText = `$${unpaidSum.toFixed(2)}`;
      document.getElementById('paid-total').innerText = `$${paidSum.toFixed(2)}`;
    }

    document.getElementById('add-bill-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('title').value;
      const amount = parseFloat(document.getElementById('amount').value);
      const due_date = document.getElementById('due_date').value;
      const is_recurring = document.getElementById('is_recurring').checked;

      const { error } = await supabaseClient.from('bills').insert([{ title, amount, due_date, is_recurring }]);
      if (error) alert('Error: ' + error.message);
      else {
        e.target.reset();
        fetchBills();
      }
    });

    async function togglePaid(id, currentStatus, title, amount, dueDateStr, isRecurring) {
      const newStatus = !currentStatus;
      await supabaseClient.from('bills').update({ is_paid: newStatus }).eq('id', id);

      // If marking as paid and it is a weekly bill, generate next week's bill automatically
      if (newStatus && isRecurring) {
        const currentDate = new Date(dueDateStr);
        currentDate.setDate(currentDate.getDate() + 7);
        const nextDueDate = currentDate.toISOString().split('T')[0];

        await supabaseClient.from('bills').insert([{
          title: title,
          amount: amount,
          due_date: nextDueDate,
          is_recurring: true,
          is_paid: false
        }]);
      }

      fetchBills();
    }

    async function deleteBill(id) {
      if (confirm('Delete this bill?')) {
        await supabaseClient.from('bills').delete().eq('id', id);
        fetchBills();
      }
    }

    fetchBills();
  </script>
</body>
